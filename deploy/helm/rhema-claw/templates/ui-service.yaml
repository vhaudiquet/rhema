{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rhema-claw.fullname" . }}-ui
  labels:
    {{- include "rhema-claw.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  selector:
    {{- include "rhema-claw.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
