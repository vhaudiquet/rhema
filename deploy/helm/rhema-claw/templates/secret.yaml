{{- if and (not .Values.secret.existingSecret) .Values.secret.stringData }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rhema-claw.fullname" . }}
  labels:
    {{- include "rhema-claw.labels" . | nindent 4 }}
stringData:
  {{- toYaml .Values.secret.stringData | nindent 2 }}
{{- end }}
