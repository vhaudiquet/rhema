{{- if .Values.ui.enabled }}
{{- if not .Values.ui.image.repository }}
{{- fail "ui.image.repository is required when ui.enabled: the UI image is built from deploy/docker/ui.Dockerfile" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rhema-claw.fullname" . }}-ui
  labels:
    {{- include "rhema-claw.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  # Stateless static files: scaling the UI is safe. The single-node
  # invariant belongs to the daemon, not to nginx.
  replicas: {{ .Values.ui.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "rhema-claw.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "rhema-claw.labels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ default .Chart.AppVersion .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          # The shell answering is the whole contract: the bundle is
          # static, the API calls happen browser-side against /v1.
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
{{- end }}
