apiVersion: v1
kind: Service
metadata:
  name: {{ include "rhema-claw.fullname" . }}
  labels:
    {{- include "rhema-claw.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "rhema-claw.selectorLabels" . | nindent 4 }}
    # The UI pods share the name/instance labels; without this the
    # daemon's service load-balances chat traffic to nginx.
    app.kubernetes.io/component: server
