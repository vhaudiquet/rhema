[package]
name = "rhema-subagents"
description = "The subagent extension: markdown subagent definitions and the `subagent` tool that runs them as fresh agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The step engine: a subagent is a fresh Agent on a fresh Session
rhema-core = { path = "../rhema-core", version = "0.1.0" }
# The toolkit: the inner shell, the overlay, the approval hook, the
# renderer. Default features off so a wasm build (remote-shell sandbox,
# no tokio processes) excludes them; the inner shell shares the parent
# turn's executor, so nothing here needs the local shell.
rhema-agent-tools = { path = "../rhema-agent-tools", version = "0.1.0", default-features = false }
# `wire` attaches the tool to a coding-agent config
rhema-coding-agent = { path = "../rhema-coding-agent", version = "0.1.0", default-features = false }
# The global definitions directory resolves off the config dir
rhema-config = { path = "../rhema-config", version = "0.1.0" }
# The bounded request view: the inner agent reads its history through
# it, so a long call re-sends a bounded prompt, not a growing one
rhema-transcript = { path = "../rhema-transcript", version = "0.1.0" }
# Definitions round-trip through YAML frontmatter
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
# ToolResolver is an async seam
async-trait = { workspace = true }

[dev-dependencies]
# The scripted provider drives inner agents offline; the local shell
# comes back for the tests that really run commands.
rhema-core = { path = "../rhema-core", features = ["mock"] }
rhema-agent-tools = { path = "../rhema-agent-tools", features = ["local-shell"] }
rhema-coding-agent = { path = "../rhema-coding-agent", features = ["local-shell"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"
