[package]
name = "rhema-forge-agent"
description = "Forge clients (GitHub, Gitea, GitLab) normalizing forge activity into one event vocabulary for the rhema forge-watching bot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# HTTP against the three forge REST APIs: JSON request/response bodies,
# no streaming
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# In-process HTTP mocks for offline tests
wiremock = "0.6"
