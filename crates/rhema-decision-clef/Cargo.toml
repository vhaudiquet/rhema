[package]
name = "rhema-decision-clef"
description = "Cloudflare Clef adapter for the rhema DecisionProvider seam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["native"]
# The reqwest transport behind the default constructor. Off in builds
# whose host has no sockets to speak of; the wire types and the pure
# mapping stay, so another host answers the same trait over its own
# HTTP.
native = ["dep:reqwest"]

[dependencies]
# The seam this crate implements and the vocabulary it speaks
rhema-decision = { path = "../rhema-decision", version = "0.5.0", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
# dyn DecisionProvider
async-trait = { workspace = true }
# HTTP against Workers AI (feature `native`)
reqwest = { version = "0.13", features = ["json"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# In-process HTTP mock for offline adapter tests
wiremock = "0.6"

[lints]
workspace = true
