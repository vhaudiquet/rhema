[package]
name = "rhema-provider"
description = "Shared base of the rhema provider adapters: model card, pricing, SSE decoding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The shared reqwest client settings (connect budget, stream stall
# guard, bounded name lookup) the native adapters build their HTTP
# clients from. Off for hosts without sockets, which bring their own
# transport. It also carries tokio's `net` for the bounded name lookup,
# because mio does not compile for wasm.
http-client = ["dep:reqwest", "tokio/net"]

[dependencies]
# The ModelProvider seam the retry decorator implements and the
# ProviderError it classifies
rhema-core = { path = "../rhema-core", version = "0.5.0" }
# The Stream trait under the transport seam's byte-stream type; the
# core trait only, no runtime
futures-core = { version = "0.3", default-features = false }
# The card and the price record round-trip through stored catalogs
serde = { workspace = true }
# The transport seam's JSON body helper
serde_json = { workspace = true }
# Typed transport errors
thiserror = { workspace = true }
# dyn InteractiveLogin: the frontends hold boxed flows
async-trait = { workspace = true }
# The retry decorator's backoff sleeps. The name lookup's `net` rides
# on `http-client`: a wasm host has no sockets to look names up in.
tokio = { workspace = true, features = ["time"] }
# The client builder behind the `http-client` feature
reqwest = { version = "0.13", optional = true }

[dev-dependencies]
# The login-flow tests run on the test runtime; start_paused (test-util)
# drives the retry ladder's sleeps virtually.
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
# Generated SSE bodies and arbitrary split points for the decoder's
# split-invariance property.
hegeltest = { workspace = true }

[lints]
workspace = true
