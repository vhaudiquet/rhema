[package]
name = "rhema-provider"
description = "Shared base of the rhema provider adapters: model card, pricing, SSE decoding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The card and the price record round-trip through stored catalogs
serde = { workspace = true }
# dyn InteractiveLogin: the frontends hold boxed flows
async-trait = { workspace = true }

[dev-dependencies]
# The login-flow tests run on the test runtime
tokio = { workspace = true, features = ["macros", "rt"] }
