[package]
name = "rhema-provider-copilot"
description = "GitHub Copilot adapter for the rhema ModelProvider seam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rhema-core = { path = "../rhema-core", version = "0.1.0" }
# The shared model card, SSE decoder, and login-flow seam
rhema-provider = { path = "../rhema-provider", version = "0.1.0" }
# The OpenAI chat-completions dialect core this adapter speaks
rhema-provider-openai-compatible = { path = "../rhema-provider-openai-compatible", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# HTTP + SSE streaming against the Copilot proxy API
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The cached short-lived Copilot token refreshes across awaited calls,
# and the device flow sleeps between polls
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# In-process HTTP mock for offline SSE and device-flow tests
wiremock = "0.6"

[lints]
workspace = true
