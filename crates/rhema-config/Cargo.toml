[package]
name = "rhema-config"
description = "Persistent rhema settings: stored provider keys and last-used choices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rhema-core = { path = "../rhema-core", version = "0.4.2" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
# The encrypted file store (see src/secrets.rs): the age format, a
# pure-Rust X25519 + ChaCha20-Poly1305 implementation. The 0.12.1
# release still pins ml-kem 0.2, whose `kem` requirement collides with
# the 0.3 that russh needs (see crates/rhema-sandbox-ssh). Main has
# moved to the new RustCrypto stack (ml-kem 0.3) with the same X25519
# API; pin a rev until a release carries it.
age = { git = "https://github.com/str4d/rage", rev = "eaa85530ba78734924ccf41b16dd55daa29b7cfd" }
# The old OS keyring, read-only: the one-way importer opens it to copy
# `secret_ref`s the file store is missing. Nothing writes or deletes
# there, and an SSH session skips it (see src/secrets.rs).
keyring = { version = "4", default-features = false, features = ["v1"] }

# age's rand pulls getrandom, whose wasm32-unknown-unknown backend is
# opt-in and would otherwise fail the cloud frontend's wasm check. The
# feature is enabled on that target only, through the crate that brings
# getrandom into the graph.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
