[package]
name = "rhema-config"
description = "Persistent rhema settings: stored provider keys and last-used choices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rhema-core = { path = "../rhema-core", version = "0.4.2" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
# The encrypted file store (see src/secrets.rs): the age format, a
# pure-Rust X25519 + ChaCha20-Poly1305 implementation. 0.12 pulls
# ml-kem 0.2.1, which currently fails to build against crypto-common
# 0.2; 0.11 has the same X25519 API without the post-quantum branch.
age = "0.11"
# The old OS keyring, read-only: the one-way importer opens it to copy
# `secret_ref`s the file store is missing. Nothing writes or deletes
# there, and an SSH session skips it (see src/secrets.rs).
keyring = { version = "4", default-features = false, features = ["v1"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
