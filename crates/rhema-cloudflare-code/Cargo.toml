[package]
name = "rhema-cloudflare-code"
description = "The coding agent as a Cloudflare Durable Object: WebSocket chat, DO-storage checkpoints, bash in a Cloudflare Sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# A deployment artifact, not a library: the worker feature only
# compiles on wasm32, so crates.io has nothing it can serve. The
# deployable ships from deploy/cloudflare instead.
publish = false

[features]
default = []
# The workers-rs glue (the `worker` module). The feature only takes
# effect on wasm32 — workerd is the one host that provides the
# bindings — so native `--all-features` builds stay clean.
worker = []

[dependencies]
# The harness the DO assembles: assembly, gate, sandbox seam — shared
# with the other cloud frontends, tested on the host without wasm.
rhema-cloud-agent = { path = "../rhema-cloud-agent", version = "0.2.0" }
# The toolkit pieces the worker touches directly: the fail-safe
# turn-level approval and the skill shape
rhema-agent-tools = { path = "../rhema-agent-tools", version = "0.2.0", default-features = false }
# The engine's session type the checkpoints wrap
rhema-core = { path = "../rhema-core", version = "0.2.0" }
# The transport seam the fetch transport implements, and the Sleeper
# the Delay sleeper implements
rhema-provider = { path = "../rhema-provider", version = "0.2.0" }
# The Anthropic dialect over a caller-supplied transport; the native
# reqwest feature stays off — workerd has no sockets
rhema-provider-anthropic = { path = "../rhema-provider-anthropic", version = "0.2.0", default-features = false }
# The revision-guarded record the DO checkpoints sessions through
rhema-rsd = { path = "../rhema-rsd", version = "0.2.0", default-features = false }
# The sandbox seam the DO's bash runs through: `SandboxDo` speaks the
# shared protocol types
rhema-sandbox = { path = "../rhema-sandbox", version = "0.2.0", default-features = false }
# The protocol's HTTPS client: the `HttpTransport` seam this worker
# implements over host fetch, plus the `HttpSandbox` the `http` backend
# drives — reqwest behind its `native` feature, off here, workerd has
# no sockets
rhema-sandbox-http = { path = "../rhema-sandbox-http", version = "0.2.0", default-features = false }
rhema-transcript = { path = "../rhema-transcript", version = "0.2.0" }
# The typed errors the backend choice and the turn's durable pieces report
thiserror = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned to 0.8 (verified against this tree): the DurableObject trait,
# SqlStorage, WebSocket, and Delay APIs this crate uses are 0.8-shaped;
# the crate is 0.x and its API moves, so the pin is deliberate.
worker = { version = "0.8.7" }
# The shim's file payloads ride base64
base64 = "0.22"
# The !Send fetch-stream bridge (spawn_local) and the turn task
wasm-bindgen-futures = "0.4"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[lints]
workspace = true
