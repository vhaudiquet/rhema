[package]
name = "rhema-provider-openai-compatible"
description = "Generic OpenAI-compatible chat-completions adapter for the rhema ModelProvider seam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rhema-core = { path = "../rhema-core", version = "0.2.2" }
# The shared model card, pricing, and SSE decoder
rhema-provider = { path = "../rhema-provider", version = "0.2.2" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# HTTP + SSE streaming against OpenAI-compatible chat-completions APIs
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# In-process HTTP mock for offline SSE tests
wiremock = "0.6"

[lints]
workspace = true
