[package]
name = "rhema-provider-registry"
description = "The provider fleet's name-to-adapter wiring: one build call per rhema-config PROVIDERS spelling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rhema-core = { path = "../rhema-core", version = "0.5.0" }
rhema-provider = { path = "../rhema-provider", version = "0.5.0" }
rhema-provider-anthropic = { path = "../rhema-provider-anthropic", version = "0.5.0" }
rhema-provider-chatgpt = { path = "../rhema-provider-chatgpt", version = "0.5.0" }
rhema-provider-copilot = { path = "../rhema-provider-copilot", version = "0.5.0" }
rhema-provider-google = { path = "../rhema-provider-google", version = "0.5.0" }
rhema-provider-llama-cpp = { path = "../rhema-provider-llama-cpp", version = "0.5.0" }
rhema-provider-mistral = { path = "../rhema-provider-mistral", version = "0.5.0" }
rhema-provider-openai-compatible = { path = "../rhema-provider-openai-compatible", version = "0.5.0" }
rhema-provider-openrouter = { path = "../rhema-provider-openrouter", version = "0.5.0" }
rhema-provider-opencode = { path = "../rhema-provider-opencode", version = "0.5.0" }
# The facts decorator over every listing this crate assembles
rhema-model-catalog = { path = "../rhema-model-catalog", version = "0.5.0" }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The test-install hook points the catalog cache at the mock endpoint
rhema-model-catalog = { path = "../rhema-model-catalog", version = "0.5.0", features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# In-process HTTP mock for offline route tests
wiremock = "0.6"

[lints]
workspace = true
