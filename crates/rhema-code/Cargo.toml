[package]
name = "rhema-code"
description = "The rhema-code frontend: terminal UI and pipeable one-shot runner (binary: rhema)"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "rhema"
path = "src/lib.rs"

[[bin]]
name = "rhema"
path = "src/main.rs"

[features]
# Scripted MockProvider for offline turn-level tests; mirrors rhema-core's
# feature.
mock = ["rhema-core/mock", "rhema-coding-agent/mock"]

[dependencies]
rhema-core = { path = "../rhema-core", version = "0.2.0" }
rhema-config = { path = "../rhema-config", version = "0.2.0" }
rhema-agent-tools = { path = "../rhema-agent-tools", version = "0.2.0" }
rhema-coding-agent = { path = "../rhema-coding-agent", version = "0.2.0" }
# The subagent extension: discovered definitions wired in as one tool
rhema-subagents = { path = "../rhema-subagents", version = "0.2.0" }
# The bounded request view, when --transcript is set
rhema-transcript = { path = "../rhema-transcript", version = "0.2.0" }
# The `rhema acp` subcommand: the Agent Client Protocol server
rhema-acp = { path = "../rhema-acp", version = "0.2.0" }
# Where bash runs: the sandbox seam and its backends — docker, lxd,
# ecrou, ssh, http — behind the stored choice; the seam itself brings
# `FsRoot` (feature `spawn`)
rhema-sandbox = { path = "../rhema-sandbox", version = "0.2.0", features = [
    "spawn",
] }
rhema-sandbox-ecrou = { path = "../rhema-sandbox-ecrou", version = "0.2.0" }
rhema-sandbox-lxd = { path = "../rhema-sandbox-lxd", version = "0.2.0" }
rhema-sandbox-docker = { path = "../rhema-sandbox-docker", version = "0.2.0" }
rhema-sandbox-http = { path = "../rhema-sandbox-http", version = "0.2.0" }
rhema-sandbox-ssh = { path = "../rhema-sandbox-ssh", version = "0.2.0" }
# The shared model card every adapter's catalog normalizes into
rhema-provider = { path = "../rhema-provider", version = "0.2.0" }
rhema-provider-registry = { path = "../rhema-provider-registry", version = "0.2.0" }
rhema-provider-anthropic = { path = "../rhema-provider-anthropic", version = "0.2.0" }
rhema-provider-copilot = { path = "../rhema-provider-copilot", version = "0.2.0" }
rhema-provider-openai-compatible = { path = "../rhema-provider-openai-compatible", version = "0.2.0" }
rhema-provider-openrouter = { path = "../rhema-provider-openrouter", version = "0.2.0" }
# Derives for the saved session's usage-stats blob (src/sessions.rs);
# the session types themselves live in rhema-core
serde = { workspace = true }
# Full-screen rendering; the crossterm version must stay the one ratatui
# builds on so the event types unify.
ratatui = "0.30"
crossterm = "0.29"
# Display width for the transcript word wrap (same crate ratatui uses)
unicode-width = "0.2"
# CommonMark parser for rendering assistant markdown (same crate rustdoc uses)
pulldown-cmark = "0.13"
# Argument wiring and binary error reporting
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
serde_json = { workspace = true }
# Turn tasks and the unbounded UI event channel
async-trait = { workspace = true }
# The system clipboard, for ctrl-v as a paste key where the terminal
# does not bind it itself; image-data so a copied image pastes as a
# chip like a text paste does
arboard = { version = "3", default-features = false, features = [
    "wayland-data-control",
    "image-data",
] }
# RGBA clipboard pixels re-encoded as PNG before they ride a message
image = { version = "0.25", default-features = false, features = ["png"] }
# The image block's data is bare base64
base64 = "0.22"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
rhema-mcp = { version = "0.2.0", path = "../rhema-mcp" }
serde_yaml.workspace = true

[dev-dependencies]
# The sandbox tests drive the scripted sandbox
rhema-sandbox = { path = "../rhema-sandbox", features = ["mock"] }
tempfile = "3"

[lints]
workspace = true
