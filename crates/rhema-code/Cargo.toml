[package]
name = "rhema-code"
description = "The rhema-code frontend: terminal UI and pipeable one-shot runner (binary: rhema)"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "rhema"
path = "src/lib.rs"

[[bin]]
name = "rhema"
path = "src/main.rs"

[features]
# Scripted MockProvider for offline turn-level tests; mirrors rhema-core's
# feature.
mock = ["rhema-core/mock", "rhema-host-agent/mock"]
# Cross builds link no target OpenSSL: this turns the vendored build on
# for the whole graph through feature unification, so the arm64 and
# riscv64 release legs need no target libssl-dev. Native builds keep
# the system library.
vendored-openssl = ["dep:openssl"]

[dependencies]
rhema-core = { path = "../rhema-core", version = "0.4.2" }
# The session store seam and its file backend: saved sessions, the
# checkpoint write, the resume listing
rhema-session-store = { path = "../rhema-session-store", version = "0.4.2" }
rhema-session-store-file = { path = "../rhema-session-store-file", version = "0.4.2" }
rhema-config = { path = "../rhema-config", version = "0.4.2" }
rhema-bash = { path = "../rhema-bash", version = "0.4.2" }
rhema-prompt = { path = "../rhema-prompt", version = "0.4.2" }
rhema-host-agent = { path = "../rhema-host-agent", version = "0.4.2" }
# Skill discovery: the tiers, the frontmatter, the shadowing
rhema-skills = { path = "../rhema-skills", version = "0.4.2" }
# The subagent extension: discovered definitions wired in as one tool
rhema-subagents = { path = "../rhema-subagents", version = "0.4.2" }
# The submission ledger a resumed session reconciles before any turn
rhema-submissions = { path = "../rhema-submissions", version = "0.4.2" }
# The bounded request view, when --transcript is set
rhema-transcript = { path = "../rhema-transcript", version = "0.4.2" }
# The `rhema acp` subcommand: the Agent Client Protocol server
rhema-acp = { path = "../rhema-acp", version = "0.4.2" }
# Where bash runs: the sandbox seam and its backends, docker, lxd,
# ecrou, ssh, http, behind the stored choice; the seam itself brings
# `FsRoot` (feature `spawn`)
rhema-sandbox = { path = "../rhema-sandbox", version = "0.4.2", features = [
    "spawn",
] }
rhema-sandbox-ecrou = { path = "../rhema-sandbox-ecrou", version = "0.4.2" }
rhema-sandbox-lxd = { path = "../rhema-sandbox-lxd", version = "0.4.2" }
rhema-sandbox-docker = { path = "../rhema-sandbox-docker", version = "0.4.2" }
rhema-sandbox-http = { path = "../rhema-sandbox-http", version = "0.4.2" }
rhema-sandbox-ssh = { path = "../rhema-sandbox-ssh", version = "0.4.2" }
# The shared model card every adapter's catalog normalizes into
rhema-provider = { path = "../rhema-provider", version = "0.4.2" }
rhema-provider-registry = { path = "../rhema-provider-registry", version = "0.4.2" }
rhema-provider-anthropic = { path = "../rhema-provider-anthropic", version = "0.4.2" }
rhema-provider-copilot = { path = "../rhema-provider-copilot", version = "0.4.2" }
rhema-provider-chatgpt = { path = "../rhema-provider-chatgpt", version = "0.4.2" }
rhema-provider-mistral = { path = "../rhema-provider-mistral", version = "0.4.2" }
rhema-provider-openai-compatible = { path = "../rhema-provider-openai-compatible", version = "0.4.2" }
rhema-provider-opencode = { path = "../rhema-provider-opencode", version = "0.4.2" }
rhema-provider-openrouter = { path = "../rhema-provider-openrouter", version = "0.4.2" }
# Derives for the saved session's usage-stats blob (src/sessions.rs);
# the session types themselves live in rhema-core
serde = { workspace = true }
# Full-screen rendering; the crossterm version must stay the one ratatui
# builds on so the event types unify.
ratatui = "0.30"
crossterm = "0.29"
# The SIGHUP/SIGTERM/SIGINT watcher thread that restores the terminal
# on an ssh drop or an external kill (`install_signal_restore`);
# crossterm already pulls both crate and version, so the lockfile
# does not move.
signal-hook = "0.4"
# Display width for the transcript word wrap (same crate ratatui uses)
unicode-width = "0.2"
# CommonMark parser for rendering assistant markdown (same crate rustdoc uses)
pulldown-cmark = "0.13"
# Argument wiring and binary error reporting
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
serde_json = { workspace = true }
# Civil dates for the picker's one-year cutoff; the workspace's one copy
# of the calendar
datealgo = { workspace = true }
# Turn tasks and the unbounded UI event channel
async-trait = { workspace = true }
# The system clipboard, for ctrl-v as a paste key where the terminal
# does not bind it itself; image-data so a copied image pastes as a
# chip like a text paste does
arboard = { version = "3", default-features = false, features = [
    "wayland-data-control",
    "image-data",
] }
# RGBA clipboard pixels re-encoded as PNG before they ride a message
image = { version = "0.25", default-features = false, features = ["png"] }
# The image block's data is bare base64
base64 = "0.23"
# Only the `vendored-openssl` feature brings this in. A dependency edge
# is how the feature reaches openssl-sys for every crate in the graph.
openssl = { version = "0.10", features = ["vendored"], optional = true }
# The search macro's fleet: the seam, the three adapters through the
# registry, and the profile assembly the __search mode runs
rhema-websearch = { path = "../rhema-websearch", version = "0.4.2", default-features = false }
rhema-websearch-registry = { path = "../rhema-websearch-registry", version = "0.4.2" }
# The decide macro's fleet: the seam and the profile-to-chain assembly
# the __decision mode runs (the adapters ride behind the registry)
rhema-decision = { path = "../rhema-decision", version = "0.4.2", default-features = false }
rhema-decision-registry = { path = "../rhema-decision-registry", version = "0.4.2" }
# The add dialog prefills the Go endpoint its decision row stores
rhema-decision-opencode = { path = "../rhema-decision-opencode", version = "0.4.2" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
serde_yaml.workspace = true
# The installer's published `<url>.sha256` is checked before it runs
sha2 = "0.11"
# A private, uniquely named file for the fetched install script
tempfile = "3"
# The host endpoint's per-session bearer token
rand = "0.10"

[dev-dependencies]
# The __search mode tests drive a scripted chain
rhema-websearch = { path = "../rhema-websearch", version = "0.4.2", features = ["mock"] }
# The __decision mode tests drive a scripted chain
rhema-decision = { path = "../rhema-decision", version = "0.4.2", features = ["mock"] }
# The sandbox tests drive the scripted sandbox
rhema-sandbox = { path = "../rhema-sandbox", features = ["mock"] }
tempfile = "3"


[lints]
workspace = true
