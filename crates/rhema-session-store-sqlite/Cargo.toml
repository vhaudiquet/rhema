[package]
name = "rhema-session-store-sqlite"
description = "The SQLite session store backend: one row per session, WAL, synchronous=FULL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The trait, ids, metadata, errors, and the opening-prompt helper
rhema-session-store = { path = "../rhema-session-store", version = "0.5.0" }
# The saved value
rhema-core = { path = "../rhema-core", version = "0.5.0" }
# Bundled: no system sqlite, and the same version rhema-rsd locks, so
# the workspace builds one copy.
rusqlite = { version = "0.43", features = ["bundled"] }
# The body is the same pretty JSON the file format holds
serde_json = { workspace = true }

[dev-dependencies]
# The replayable contract suite
rhema-session-store = { path = "../rhema-session-store", version = "0.5.0", features = ["store-contract"] }
# The cross-backend equality test: a file store's Session and a SQLite
# Session round-trip equal.
rhema-session-store-file = { path = "../rhema-session-store-file", version = "0.5.0" }
tempfile = "3"

[lints]
workspace = true
