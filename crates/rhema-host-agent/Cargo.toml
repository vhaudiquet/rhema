[package]
name = "rhema-host-agent"
description = "The host-agent driver on top of rhema-core: turn loop, session persistence, the SYSTEM.md template"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["local-shell"]
# The local shell: commands run as child processes on this host. Off in
# wasm builds whose shell lives in a remote sandbox.
local-shell = ["rhema-bash/local-shell"]
# Scripted MockProvider for offline tests; mirrors rhema-core's feature.
mock = ["rhema-core/mock"]

[dependencies]
# The tools the driver runs on: the approval-gated shell and the
# macros that ride it, and the system prompt with its skills list.
# Default features off; the `local-shell` feature (default on) brings
# the process shell back, and a wasm build turns it off.
rhema-bash = { path = "../rhema-bash", version = "0.4.2", default-features = false }
rhema-prompt = { path = "../rhema-prompt", version = "0.4.2" }
rhema-skills = { path = "../rhema-skills", version = "0.4.2" }
rhema-config = { path = "../rhema-config", version = "0.4.2" }
rhema-core = { path = "../rhema-core", version = "0.4.2" }
# The bounded view over an unbounded session, when the config enables it
rhema-transcript = { path = "../rhema-transcript", version = "0.4.2" }
# `save_session_to`/`load_session_from`: the seam's error type and the
# one atomic, fsynced session-file writer, shared with the frontends'
# stores
rhema-session-store = { path = "../rhema-session-store", version = "0.4.2" }
rhema-session-store-file = { path = "../rhema-session-store-file", version = "0.4.2" }
# The SYSTEM.md template engine: the renderer lives in the toolkit,
# the template error type stays with the driver
minijinja = { workspace = true }
# The environment report's probe inventory (environment.yaml): the
# report's data parsed once at first use
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Days since the Unix epoch to (year, month, day), Hinnant's
# civil-date algorithm, shared by every stamp and rendering
datealgo = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[lints]
workspace = true
