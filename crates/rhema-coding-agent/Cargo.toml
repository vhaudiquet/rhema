[package]
name = "rhema-coding-agent"
description = "The coding-agent driver on top of rhema-core: built-in tools, turn loop, session persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Scripted MockProvider for offline tests; mirrors rhema-core's feature.
mock = ["rhema-core/mock"]

[dependencies]
rhema-config = { path = "../rhema-config" }
rhema-core = { path = "../rhema-core" }
# The SYSTEM.md template engine
minijinja = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# Subprocess execution for the command tool; its streams read line by
# line (io-util) and hand their lines to the resolver's progress
# callback across reader tasks (sync).
tokio = { workspace = true, features = ["process", "time", "io-util", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"
