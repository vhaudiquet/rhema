[package]
name = "rhema-coding-agent"
description = "The coding-agent driver on top of rhema-core: turn loop, session persistence, the SYSTEM.md template"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["local-shell"]
# The local shell: commands run as child processes on this host. Off in
# wasm builds whose shell lives in a remote sandbox.
local-shell = ["rhema-agent-tools/local-shell"]
# Scripted MockProvider for offline tests; mirrors rhema-core's feature.
mock = ["rhema-core/mock"]

[dependencies]
# The shared toolkit the driver runs on: the approval-gated shell,
# skills, paste expansion, revive-on-resume, the prompt renderer.
# Default features off; the `local-shell` feature (default on) brings
# the process shell back, and a wasm build turns it off.
rhema-agent-tools = { path = "../rhema-agent-tools", version = "0.1.0", default-features = false }
rhema-config = { path = "../rhema-config", version = "0.1.0" }
rhema-core = { path = "../rhema-core", version = "0.1.0" }
# The bounded view over an unbounded session, when the config enables it
rhema-transcript = { path = "../rhema-transcript", version = "0.1.0" }
# The SYSTEM.md template engine: the renderer lives in the toolkit,
# the template error type stays with the driver
minijinja = { workspace = true }
# The environment report's probe inventory (environment.yaml): the
# report's data parsed once at first use
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[lints]
workspace = true
