[package]
name = "rhema-coding-agent"
description = "The coding-agent driver on top of rhema-core: turn loop, session persistence, the SYSTEM.md template"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Scripted MockProvider for offline tests; mirrors rhema-core's feature.
mock = ["rhema-core/mock"]

[dependencies]
# The shared toolkit the driver runs on: the approval-gated shell,
# skills, paste expansion, revive-on-resume, the prompt renderer
rhema-agent-tools = { path = "../rhema-agent-tools" }
rhema-config = { path = "../rhema-config" }
rhema-core = { path = "../rhema-core" }
# The SYSTEM.md template engine: the renderer lives in the toolkit,
# the template error type stays with the driver
minijinja = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"
