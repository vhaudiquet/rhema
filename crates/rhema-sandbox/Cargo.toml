[package]
name = "rhema-sandbox"
description = "The sandbox seam: the `Sandbox` contract, the `ShellSandbox` adapter, the wire protocol, and the backend family's shared machinery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The daemon binary's wiring rests at src/bin/rhema-sandboxd.rs until the
# stage that stands up rhema-sandbox-server takes it; with no [[bin]] here
# the auto-discovery stays off, so the orphan compiles nowhere.
autobins = false

[features]
default = []
# The scripted sandbox for offline tests; mirrors rhema-core's feature.
# Opt-in, not default: test machinery does not ship in a plain build.
mock = ["dep:tokio", "tokio/sync"]
# The process-spawning backend family's shared machinery (`exec_util.rs`,
# `fsroot.rs`), which the sibling backend crates — rhema-sandbox-local,
# -docker, -ssh — build on: the child processes and their pumped pipes,
# the cancel tick's timer, and plain fs for the file routes. `sync` rides
# with the dependency itself (the pump's channel); `macros` and `rt` come
# with the workspace pin.
spawn = ["dep:tokio", "tokio/process", "tokio/io-util", "tokio/time", "tokio/fs"]

[dependencies]
# The seam adapts onto the toolkit's exec-only shell; it arrives
# without the local shell, which every backend of this family replaces.
rhema-agent-tools = { path = "../rhema-agent-tools", version = "0.2.2", default-features = false }
# The seed paths are the workspace conventions, spelled once in core.
rhema-core = { path = "../rhema-core", version = "0.2.2" }
async-trait = { workspace = true }
serde = { workspace = true }
# The protocol tests pin the wire's JSON
serde_json = { workspace = true }
thiserror = { workspace = true }
# The scripted sandbox's parked exec (feature `mock`) and the process
# machinery's processes, pipes, timer, and fs (feature `spawn`)
tokio = { workspace = true, optional = true, features = ["sync"] }

[dev-dependencies]
# The seed tests drive the scripted sandbox: this self edge turns the
# `mock` feature on for test builds only (dev-dependencies do not
# propagate to consumers).
rhema-sandbox = { path = ".", features = ["mock"] }
# exec_util's pump tests hand their lines through an unbounded channel;
# `macros` and `rt` come with the workspace pin
tokio = { workspace = true, features = ["sync"] }
# The fsroot tests run against throwaway host directories
tempfile = "3"

[lints]
workspace = true
