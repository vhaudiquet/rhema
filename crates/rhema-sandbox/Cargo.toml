[package]
name = "rhema-sandbox"
description = "The sandbox seam: the `Sandbox` contract, the `ShellSandbox` adapter, and the wire protocol's shared machinery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["local", "mock"]
# The scripted sandbox for offline tests; mirrors rhema-core's feature.
mock = ["dep:tokio"]
# The process-spawning backends: commands as host processes rooted at
# one directory (`fsroot.rs`, `local.rs`), in a bind-mounted container
# through the docker CLI (`docker.rs`), or over ssh (`ssh.rs`) — with
# `exec_util.rs` the machinery they share. tokio rides with the features
# this code adds — process exec, buffered line reads, the cancel tick's
# timer, and plain fs for the file routes; `sync`, `macros`, and `rt`
# come with the dependency itself, which the mock's parked exec needs.
local = ["dep:tokio", "tokio/process", "tokio/io-util", "tokio/time", "tokio/fs"]
# The protocol over plain HTTPS (feature `client`), reqwest behind the
# native transport, rustls for TLS so no system store is linked. Wasm
# builds leave the feature off and bring their own `HttpTransport` over
# host fetch — the provider family's `native` precedent.
client = ["dep:reqwest", "dep:tokio"]
# The protocol served from a host (`server.rs`, the `rhema-sandboxd`
# binary): axum for the routes, a multi-thread runtime and sockets for
# serving, the local backend for the exec and seed routes (a
# `LocalSandbox` per request), clap for the binary's args.
server = ["dep:axum", "dep:clap", "local", "tokio/rt-multi-thread", "tokio/net"]

[dependencies]
# The seam adapts onto the toolkit's exec-only shell; it arrives
# without the local shell, which every backend of this family replaces.
rhema-agent-tools = { path = "../rhema-agent-tools", version = "0.1.0", default-features = false }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The scripted sandbox's parked exec (feature `mock`) and the local
# backend's processes (feature `local`)
tokio = { workspace = true, optional = true, features = ["sync"] }
# File contents cross the put/get routes base64
base64 = "0.22"
# The daemon's HTTP surface (feature `server`), the workspace's pin
axum = { workspace = true, optional = true }
# The daemon binary's args (feature `server`); the version pin mirrors
# the rest of the workspace's
clap = { version = "4.5", features = ["derive"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The protocol's native HTTP transport (feature `client`); the version
# pin mirrors the rest of the workspace's. Native-only: reqwest's own
# wasm client is `!Send` under the transport's `Send` contract, and
# workerd gives wasm no sockets anyway — a wasm build brings its own
# `HttpTransport` over host fetch, and reqwest stays out of its build.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
], optional = true }

[dev-dependencies]
# Driving the loopback HTTP tests: a raw listener and hand-rolled
# HTTP/1.1 replies, so the test pins the wire, not a framework's
# reading of it
tokio = { workspace = true, features = ["io-util", "net"] }
# The fsroot and local tests run against throwaway host directories
tempfile = "3"

# The daemon; skipped without the `server` feature, which is what its
# code compiles behind.
[[bin]]
name = "rhema-sandboxd"
path = "src/bin/rhema-sandboxd.rs"
required-features = ["server"]
