[package]
name = "rhema-sandbox"
description = "The sandbox seam: the `Sandbox` contract, the `ShellSandbox` adapter, and the wire protocol's shared machinery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["mock"]
# The scripted sandbox for offline tests; mirrors rhema-core's feature.
mock = ["dep:tokio"]
# The protocol over plain HTTPS (feature `client`), reqwest behind the
# native transport, rustls for TLS so no system store is linked. Wasm
# builds leave the feature off and bring their own `HttpTransport` over
# host fetch — the provider family's `native` precedent.
client = ["dep:reqwest", "dep:tokio"]

[dependencies]
# The seam adapts onto the toolkit's exec-only shell; it arrives
# without the local shell, which every backend of this family replaces.
rhema-agent-tools = { path = "../rhema-agent-tools", version = "0.1.0", default-features = false }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The scripted sandbox's parked exec (feature `mock`)
tokio = { workspace = true, optional = true, features = ["sync"] }
# File contents cross the put/get routes base64
base64 = "0.22"
# The protocol's native HTTP transport (feature `client`); the version
# pin mirrors the rest of the workspace's
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
], optional = true }

[dev-dependencies]
# Driving the loopback HTTP tests: a raw listener and hand-rolled
# HTTP/1.1 replies, so the test pins the wire, not a framework's
# reading of it
tokio = { workspace = true, features = ["io-util", "net"] }
