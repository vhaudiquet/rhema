[package]
name = "rhema-sandbox-local"
description = "Local sandbox backend for the rhema `Sandbox` seam: commands as host processes rooted at one host directory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The seam and the process family's shared machinery (`spawn`): the
# stream pump, the fs routes, `FsRoot`
rhema-sandbox = { path = "../rhema-sandbox", version = "0.1.0", features = ["spawn"] }
async-trait = { workspace = true }
# File contents cross the seed staging base64
base64 = "0.22"
# The `timeout` child, the seed's `git`/`tar` runs, the cancel tick's timer
tokio = { workspace = true, features = ["process", "io-util", "time", "fs"] }

[dev-dependencies]
# The tests run on the test runtime, against throwaway host directories
tokio = { workspace = true }
tempfile = "3"

[lints]
workspace = true
