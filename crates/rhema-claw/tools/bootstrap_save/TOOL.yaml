# The model-facing spec of the bootstrap_save tool; the operation is the
# compiled builtin named under `run`.
name: bootstrap_save
description: >-
  Write one of your identity files Overwrites the file, 
  so send the whole document every time. Both files enter every
  request: keep each one small, stable, and high-signal.
parameters:
  type: object
  properties:
    kind:
      type: string
      enum: [soul, user]
      description: "Which file to write"
    content:
      type: string
      description: The file's full markdown contents.
  required: [kind, content]
run:
  builtin: bootstrap.save
