[package]
name = "rhema-autonomous-agent"
description = "The resident-agent core tier: source-driven sessions, a tool registry with allowlists, and the lease-driven handler loop over rhema-rsd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The resident tier is still indev: `cargo publish --workspace` skips
# it until the claw ships.
publish = false

[dependencies]
# The dispatch seam: sources ingest, the driver runs admitted keys
rhema-rsd = { path = "../rhema-rsd", version = "0.2.0" }
# The step engine and its seams: tools resolve through a ToolResolver
rhema-core = { path = "../rhema-core", version = "0.2.0" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# The driver runs admitted keys concurrently
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
