[package]
name = "rhema-cloud-agent"
description = "The coding-agent harness for cloud frontends: assembly without a filesystem, a client approval gate, and a pluggable sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# The scripted sandbox for offline tests; mirrors rhema-core's feature.
mock = ["dep:tokio"]

[dependencies]
# The toolkit and driver run on the seams, not on a filesystem: both
# come in without the local shell, which this crate's sandbox executor
# replaces.
rhema-agent-tools = { path = "../rhema-agent-tools", version = "0.1.0", default-features = false }
rhema-coding-agent = { path = "../rhema-coding-agent", version = "0.1.0", default-features = false }
rhema-core = { path = "../rhema-core", version = "0.1.0" }
# Transcript settings in the session config
rhema-transcript = { path = "../rhema-transcript", version = "0.1.0" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The scripted sandbox's parked exec (feature `mock`)
tokio = { workspace = true, optional = true, features = ["sync"] }

[dev-dependencies]
# The scripted provider drives the turn loop offline
rhema-core = { path = "../rhema-core", features = ["mock"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[[test]]
name = "e2e"
required-features = ["mock"]
