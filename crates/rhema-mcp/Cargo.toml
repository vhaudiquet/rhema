[package]
name = "rhema-mcp"
description = "The MCP client extension: protocol subset, connections, and the bridge turning configured servers into bash commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "net", "sync", "time"] }
# The Streamable HTTP transport rides hyper, already in the tree under
# axum: the legacy client connector plus the body utilities, not a
# second HTTP stack
hyper = { version = "1", default-features = false, features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
# HTTPS for remote Streamable HTTP endpoints. rustls with webpki roots,
# the same trust store the provider crates' reqwest builds use.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
http-body-util = "0.1"
bytes = "1"
rhema-config = { version = "0.4.2", path = "../rhema-config" }
axum.workspace = true
async-stream = "0.3.6"
futures-util = "0.3.34"
sha2 = "0.11"
base64 = "0.23"
clap = "4.6.7"
# The mapping crate: its own repository and release line
mcp-to-cli = "0.1.0"
# The system prompt lines the MCP servers render into; the init-file
# provisioner both sides share
rhema-prompt = { version = "0.4.2", path = "../rhema-prompt" }
rhema-bash = { version = "0.4.2", path = "../rhema-bash", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# The wire-turn end-to-end drives a HostAgent over a scripted
# provider. Dev-only: the production graph stays disconnected (the
# frontends bring the driver, the crate never does).
rhema-host-agent = { version = "0.4.2", path = "../rhema-host-agent" }
rhema-core = { version = "0.4.2", path = "../rhema-core" }
async-trait.workspace = true

[[test]]
name = "fake_server"
harness = false

[[test]]
name = "wire_turn"
harness = false

[lints]
workspace = true
