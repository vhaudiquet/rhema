[package]
name = "rhema-vercel-agent"
description = "The coding agent on Vercel: an axum server over the shared cloud harness, bash in a Vercel Sandbox, sessions in Postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The harness the server assembles: assembly, gate, sandbox seam, wire
# protocol, per-session config — shared with the Cloudflare frontend
rhema-cloud-agent = { path = "../rhema-cloud-agent", version = "0.1.0" }
# The fail-safe turn-level approval and the skill shape
rhema-agent-tools = { path = "../rhema-agent-tools", version = "0.1.0", default-features = false }
# The engine's session type the checkpoints wrap, and the events the
# wire carries
rhema-core = { path = "../rhema-core", version = "0.1.0" }
# The retry ladder around the provider
rhema-provider = { path = "../rhema-provider", version = "0.1.0" }
# The Anthropic dialect over the native reqwest transport — the host
# has sockets, so the feature stays on
rhema-provider-anthropic = { path = "../rhema-provider-anthropic", version = "0.1.0", features = ["native"] }
# The revision-guarded record the server checkpoints sessions through
rhema-rsd = { path = "../rhema-rsd", version = "0.1.0", default-features = false }
rhema-transcript = { path = "../rhema-transcript", version = "0.1.0" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The HTTP surface: the ws feature upgrades /ws/:id to a WebSocket
axum = { workspace = true, features = ["ws"] }
# The socket split: sink and stream halves for the writer task
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# The server runtime: real tasks, real timers
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# The Vercel Sandbox REST client
reqwest = { version = "0.12", features = ["json"] }
# The sync Postgres client the Store contract wants; TLS joins through
# postgres-native-tls when the connection string asks for it
postgres = { version = "0.19", features = ["with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
# The seed tarball rides base64, the fs/write upload is gzipped tarball
base64 = "0.22"
tar = "0.4"
flate2 = "1"

[dev-dependencies]
# Driving the offline sandbox tests
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[[bin]]
name = "rhema-vercel-agent"
path = "src/main.rs"
