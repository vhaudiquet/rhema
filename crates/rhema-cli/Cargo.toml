[package]
name = "rhema-cli"
description = "Terminal UI for the rhema coding agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "rhema"
path = "src/main.rs"

[dependencies]
rhema-core = { path = "../rhema-core" }
rhema-coding-agent = { path = "../rhema-coding-agent" }
rhema-provider-google = { path = "../rhema-provider-google" }
# Argument wiring and binary error reporting
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
