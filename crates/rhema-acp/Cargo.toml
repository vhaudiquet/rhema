[package]
name = "rhema-acp"
description = "The Agent Client Protocol adapter: rhema's host agent as an ACP agent subprocess"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Scripted MockProvider for offline tests; mirrors rhema-core's feature.
mock = ["rhema-core/mock", "rhema-host-agent/mock"]

[dependencies]
rhema-config = { path = "../rhema-config", version = "0.5.1" }
rhema-core = { path = "../rhema-core", version = "0.5.1" }
rhema-host-agent = { path = "../rhema-host-agent", version = "0.5.1" }
# The turn submission a prompt records, and the reconcile a load runs
rhema-submissions = { path = "../rhema-submissions", version = "0.5.1" }
# Session persistence: the seam's types and the shared file backend
rhema-session-store = { path = "../rhema-session-store", version = "0.5.1" }
rhema-session-store-file = { path = "../rhema-session-store-file", version = "0.5.1" }
# The vision wiring's env map, for the agent config's shell_env
rhema-bash = { path = "../rhema-bash", version = "0.5.1" }
# The adapter family, resolved from config the same way the other
# frontends resolve it
rhema-provider = { path = "../rhema-provider", version = "0.5.1" }
rhema-provider-registry = { path = "../rhema-provider-registry", version = "0.5.1" }
# The ACP schema and agent-side connection; `stdio` is the transport a
# subprocess agent serves on
agent-client-protocol = { workspace = true, features = ["stdio"] }
anyhow = "1"
serde_json = { workspace = true }
# serve() builds the multi-thread runtime the approval bridge parks
# workers on (block_in_place needs rt; the multi-thread scheduler is
# what makes parking deadlock-free)
tokio = { workspace = true, features = ["io-std", "rt-multi-thread", "sync"] }

# Days since the Unix epoch to (year, month, day), Hinnant's
# civil-date algorithm, shared by every stamp and rendering
datealgo = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
