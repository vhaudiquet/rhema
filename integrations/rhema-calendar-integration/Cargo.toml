[package]
name = "rhema-calendar-integration"
description = "The calendar integration: ICS/webcal feeds and the Google Calendar API normalized into one occurrence vocabulary for reminder-style dispatch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The resident tier is still indev: `cargo publish --workspace` skips
# it until the claw ships.
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# HTTP against the two feed kinds: one bounded GET per poll, no
# streaming
reqwest = { version = "0.12", features = ["json"] }
# Every wire time (RFC 3339, iCalendar's compact `YYYYMMDDTHHMMSS[Z]`,
# `VALUE=DATE` all-days) normalizes to an OffsetDateTime, and the
# vocabulary's instants round-trip as RFC 3339.
time = { version = "0.3", default-features = false, features = [
    "parsing",
    "formatting",
    "serde-well-known",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
# In-process HTTP mocks for offline tests
wiremock = "0.6"
