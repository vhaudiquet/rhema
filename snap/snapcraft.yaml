name: rhema
base: core26
title: Rhema
summary: Rhema Code, a terminal-based coding agent
description: |
  Rhema Code is a terminal-based coding agent, built on the Rhema agent framework.
license: MIT
contact: vhaudiquet343@hotmail.fr
issues: https://github.com/vhaudiquet/rhema/issues
source-code: https://github.com/vhaudiquet/rhema
website: https://rhema.rs
grade: stable
confinement: strict
platforms:
  amd64:
  arm64:
  riscv64:

apps:
  rhema:
    command: bin/rhema
    plugs:
      - network
      - network-bind
      - home
      - x11
      - wayland
      - kvm

parts:
  rhema:
    plugin: rust
    # Package the committed tree, not the working directory: a git
    # pull carries only tracked files, which keeps the (gigantic)
    # cargo target dir out of the build and makes a local `snapcraft`
    # match what CI would build. Land your work before packaging it.
    source: .
    source-type: git
    # One member of the workspace; cargo walks up to the root, so the
    # vendored crossterm ([patch.crates-io]) rides along.
    rust-path: [crates/rhema-code]
    # rust-toolchain.toml picks the toolchain; the plugin honors it.
    # Point the ELF interpreter and rpath into the snap: the binary
    # links the base's glibc and the staged libssl, and the patch is
    # what makes both resolve from the confined root at run time.
    build-attributes: [enable-patchelf]
    # The banner's edge label (rhema-code's build.rs): an edge snap
    # reads v<version>-edge.<sha>. The release workflow deletes this
    # entry before packing, so a tag build classifies as a release.
    build-environment:
      - RHEMA_BUILD_CHANNEL: edge
    build-packages:
      # The snapcraft image ships no cc and no glibc dev files: rust-lld
      # needs the crt objects, and the C dependencies (reqwest's
      # native-tls ends in openssl-sys; the bundled SQLite) need a real
      # compiler.
      - build-essential
      - pkg-config
      - libssl-dev
    stage-packages:
      - libssl3t64
