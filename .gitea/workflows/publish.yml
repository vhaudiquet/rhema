# The edge channel: every main push ships the two deployable images as
# a rolling latest + sha pair, and the chart under an ordered
# timestamped version. Release publishing (exact versions, crates.io)
# lives in release.yaml.
name: publish
on:
  push:
    branches:
      - "main"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: git.vhaudiquet.fr
  OWNER: vhaudiquet

jobs:
  build-and-push-image:
    # The two deployable images — the claw daemon (built from its
    # dedicated Dockerfile) and the static UI bundle behind nginx. amd64
    # only for now, like every other image on this registry. The chart
    # pulls them by the names below (`rhema-claw`, `rhema-claw-ui`).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: deploy/docker/claw.Dockerfile
            image: rhema-claw
          - dockerfile: deploy/docker/ui.Dockerfile
            image: rhema-claw-ui
    steps:
      - name: Checkout repository
        uses: https://gitea.com/actions/checkout@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: https://git.vhaudiquet.fr
          username: ${{ gitea.actor }}
          password: ${{ secrets.PACKAGES_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # The edge pair: rolling latest, and the sha pin the chart's
          # appVersion resolves to.
          tags: |
            git.vhaudiquet.fr/${{ env.OWNER }}/${{ matrix.image }}:latest
            git.vhaudiquet.fr/${{ env.OWNER }}/${{ matrix.image }}:${{ gitea.sha }}

  lint-and-publish-chart:
    # One Helm package repository per owner; the claw chart lands there
    # (`helm install rhema-claw oci://…`). The edge version rides the
    # base version + a timestamp (ordered, SemVer pre-release rules
    # allow no dots); appVersion pins the exact commit the image was
    # built from.
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: Checkout repository
        uses: https://gitea.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Update Chart version and appVersion
        run: |
          BASE_VERSION=$(grep '^version:' deploy/helm/rhema-claw/Chart.yaml | awk '{print $2}')
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          sed -i "s/^version:.*/version: \"${BASE_VERSION}-${TIMESTAMP}\"/" deploy/helm/rhema-claw/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ gitea.sha }}\"/" deploy/helm/rhema-claw/Chart.yaml
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_ENV"

      - name: Lint Helm chart
        run: helm lint deploy/helm/rhema-claw

      - name: Package Helm chart
        run: helm package deploy/helm/rhema-claw

      - name: Push Helm chart to Gitea registry
        run: |
          TOKEN=$(echo -n "${{ secrets.PACKAGES_TOKEN }}" | tr -d '\n')
          curl --fail --user "${{ gitea.actor }}:${TOKEN}" \
            -X POST \
            --upload-file rhema-claw-*.tgz \
            "https://git.vhaudiquet.fr/api/packages/${{ env.OWNER }}/helm/api/charts"
