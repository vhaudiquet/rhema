# The release channel: a v* tag ships the exact-version images (plus
# the sha pin the chart's appVersion resolves to), the exact-version
# chart, the rhema snap to the store's stable channel, and the library
# closure to crates.io. Edge publishing on every main push lives in
# ci.yml. Release candidates (a v* tag with a prerelease suffix,
# v0.2.0-rc1) publish nothing, like pkh's release jobs.
name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: git.vhaudiquet.fr
  OWNER: vhaudiquet

jobs:
  build-and-push-release-images:
    # The same two deployable images as the edge channel, tagged for the
    # release: the exact version, the rolling stable pin, and the sha
    # the chart's appVersion resolves to.
    if: ${{ !contains(gitea.ref_name, '-') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: deploy/docker/claw.Dockerfile
            image: rhema-claw
          - dockerfile: deploy/docker/ui.Dockerfile
            image: rhema-claw-ui
    steps:
      - name: Checkout repository
        uses: https://gitea.com/actions/checkout@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: https://git.vhaudiquet.fr
          username: ${{ gitea.actor }}
          password: ${{ secrets.PACKAGES_TOKEN }}

      - name: Compute the release version (the tag strips the v)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            git.vhaudiquet.fr/${{ env.OWNER }}/${{ matrix.image }}:${{ steps.ver.outputs.version }}
            git.vhaudiquet.fr/${{ env.OWNER }}/${{ matrix.image }}:stable
            git.vhaudiquet.fr/${{ env.OWNER }}/${{ matrix.image }}:${{ gitea.sha }}

  release-chart:
    # The exact tag version ships as-is so deployments can pin
    # `--version 0.1.0`; appVersion pins the exact commit the image was
    # built from (the chart's default image tag is appVersion, so the
    # sha image above must exist before this runs).
    if: ${{ !contains(gitea.ref_name, '-') }}
    runs-on: ubuntu-latest
    needs: build-and-push-release-images
    steps:
      - name: Checkout repository
        uses: https://gitea.com/actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Update Chart version and appVersion
        run: |
          sed -i "s/^version:.*/version: \"${GITHUB_REF_NAME#v}\"/" deploy/helm/rhema-claw/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ gitea.sha }}\"/" deploy/helm/rhema-claw/Chart.yaml

      - name: Lint Helm chart
        run: helm lint deploy/helm/rhema-claw

      - name: Package Helm chart
        run: helm package deploy/helm/rhema-claw

      - name: Push Helm chart to Gitea registry
        run: |
          TOKEN=$(echo -n "${{ secrets.PACKAGES_TOKEN }}" | tr -d '\n')
          curl --fail --user "${{ gitea.actor }}:${TOKEN}" \
            -X POST \
            --upload-file rhema-claw-*.tgz \
            "https://git.vhaudiquet.fr/api/packages/${{ env.OWNER }}/helm/api/charts"

  release-binaries:
    # The stable binary channel: the tag's tarballs under its version,
    # and the root manifest repointed at it — the shape the installer
    # resolves. Built from the committed tree, so the vendored
    # crossterm ships in the binary and the installer keeps its
    # keyboard handling (the crates.io build is the one that waits).
    # amd64 builds natively; arm64 and riscv64 cross-compile through
    # cross — its target images carry the toolchains and OpenSSL that
    # the C dependencies need (reqwest's native-tls, the bundled
    # SQLite). Each leg uploads its tarball only; the manifest job that
    # follows hashes the bytes as served, so the stable pointer never
    # moves to a partial set. darwin-arm64 joins the same way once an
    # osxcross image with a self-provided SDK exists (Apple's license
    # wants the SDK taken from your own Xcode).
    if: ${{ !contains(gitea.ref_name, '-') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: linux-amd64
            rust_target: ""
          - target: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
          - target: linux-riscv64
            rust_target: riscv64gc-unknown-linux-gnu
    steps:
      - uses: https://gitea.com/actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # The cross legs build inside the target image: the host needs
      # nothing of openssl or pkg-config there.
      - name: Install build and upload dependencies
        if: matrix.rust_target == ''
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev awscli

      - name: Install upload dependencies
        if: matrix.rust_target != ''
        run: sudo apt-get update && sudo apt-get install -y awscli

      - name: Install cross
        if: matrix.rust_target != ''
        run: |
          curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar -xz -C /usr/local/bin
          cross --version

      - name: Build
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            cross build --release -p rhema-code --target ${{ matrix.rust_target }}
            cp "target/${{ matrix.rust_target }}/release/rhema" dist-rhema
          else
            cargo build --release -p rhema-code
            cp target/release/rhema dist-rhema
          fi

      - name: Upload the tarball
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RHEMA_DIST_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RHEMA_DIST_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          version="${GITHUB_REF_NAME#v}"
          endpoint="${{ secrets.RHEMA_DIST_ENDPOINT }}"
          mkdir -p "dist/$version"
          mv dist-rhema "dist/$version/rhema"
          tar -czf "dist/$version/rhema-${{ matrix.target }}.tar.gz" -C "dist/$version" rhema
          aws s3 cp "dist/$version/rhema-${{ matrix.target }}.tar.gz" \
            "s3://get/$version/" --endpoint-url "$endpoint"

  release-manifest:
    # Hashes the tarballs as served (not as built), writes the version
    # dir's checksums.txt and the root manifest with the stable pointer
    # repointed — only reached when every leg above succeeded.
    if: ${{ !contains(gitea.ref_name, '-') }}
    needs: release-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Install upload dependencies
        run: sudo apt-get update && sudo apt-get install -y awscli

      - name: Publish the channel manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RHEMA_DIST_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RHEMA_DIST_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          version="${GITHUB_REF_NAME#v}"
          endpoint="${{ secrets.RHEMA_DIST_ENDPOINT }}"
          mkdir -p dist
          for t in linux-amd64 linux-arm64 linux-riscv64; do
            curl -fsSL "https://get.rhema.rs/$version/rhema-$t.tar.gz" -o "dist/rhema-$t.tar.gz"
          done
          (cd dist && sha256sum rhema-*.tar.gz > checksums.txt)
          # One binary per line, on the same line as its name: the
          # installer parses the manifest with line-wise sed, so
          # reformatting this through json.dumps breaks every install.
          {
            printf '{\n  "stable": "%s",\n  "binaries": {\n' "$version"
            first=yes
            for t in linux-amd64 linux-arm64 linux-riscv64; do
              sha="$(sha256sum "dist/rhema-$t.tar.gz" | awk '{print $1}')"
              [ "$first" = yes ] || printf ',\n'
              first=no
              printf '    "rhema-%s": {"url": "https://get.rhema.rs/%s/rhema-%s.tar.gz", "sha256": "%s"}\n' \
                "$t" "$version" "$t" "$sha"
            done
            printf '  }\n}\n'
          } > dist/manifest.json
          aws s3 cp dist/checksums.txt "s3://get/$version/" --endpoint-url "$endpoint"
          aws s3 cp dist/manifest.json "s3://get/manifest.json" --endpoint-url "$endpoint"

  release-snap:
    # The rhema snap to the store's stable channel. The store tracks
    # revisions itself, so the tag decides one thing: the version
    # string, rewritten before building so a tag ships exactly its
    # number (the chart's pattern). The snap packs the committed tree
    # (source-type: git), so the vendored crossterm rides along — no
    # crates.io in the build path.
    if: ${{ !contains(gitea.ref_name, '-') }}
    runs-on: ubuntu-latest
    container:
      # Official snapcraft image: an Ubuntu userland matching the snap
      # base, with snapcraft preinstalled (no snapd/systemd/LXD needed
      # for a destructive-mode pack).
      image: ghcr.io/canonical/snapcraft:8_core24
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git curl nodejs

      - uses: https://gitea.com/actions/checkout@v4

      - name: Stamp the version from the tag
        run: |
          sed -i "s/^version: .*/version: \"${GITHUB_REF_NAME#v}\"/" snap/snapcraft.yaml
          # The edge build-environment entry must not reach a tag build:
          # with it, build.rs would label a release an edge pre-release.
          sed -i -e "/RHEMA_BUILD_CHANNEL/d" -e "/^ *build-environment:$/d" snap/snapcraft.yaml
          grep '^version:' snap/snapcraft.yaml

      - name: Build the snap
        run: |
          # The runner overrides the image entrypoint (pebble), which is
          # what normally puts craftctl on PATH; restore it, let git run
          # in the checked-out tree, and provide rustup for the rust
          # plugin (rust-toolchain.toml then picks the toolchain).
          git config --global --add safe.directory '*'
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          export PATH="/usr/libexec/snapcraft:$HOME/.cargo/bin:$PATH"
          snapcraft pack --destructive-mode

      - name: Upload to the stable channel
        run: snapcraft upload rhema_*.snap --release=stable
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

  publish-crates-io:
    # The rhema-code library closure to crates.io, in dependency order —
    # cargo walks the closure so every crate uploads after its deps.
    # rhema-code itself stays excluded until its two crossterm patches
    # land upstream: a published crate cannot carry [patch.crates-io]
    # (cargo ignores patches from dependencies), and stock 0.29 does
    # not compile the TUI's keyboard handling. Until then the vendored
    # patch keeps every in-tree build (dev, CI, image) whole and the
    # binary ships through the get.rhema.rs installer.
    if: ${{ !contains(gitea.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: https://gitea.com/actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # reqwest's default TLS links openssl; rusqlite's bundled SQLite
      # needs a C compiler.
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Check the tag matches the workspace version
        # cargo publish ships whatever the manifest declares, regardless
        # of the tag: a mismatch must fail loudly instead of publishing
        # the wrong version under the release tag.
        run: |
          crate_version="$(awk -F'"' '/^version =/{print $2; exit}' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $crate_version" >&2
            exit 1
          fi

      - name: Publish
        run: cargo publish --workspace --exclude rhema-code
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
