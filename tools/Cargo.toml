[workspace]
resolver = "2"
members = ["contract", "common", "notify"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/vhaudiquet/rhema"
authors = ["Valentin Haudiquet"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt"] }
# The thin clients' HTTP: loopback, no TLS (the contract is bearer-over-HTTP
# to a loopback or otherwise trusted daemon; a remote TLS endpoint is a
# stated non-goal v1).
ureq = { version = "2", default-features = false, features = ["json"] }
# Command-line surfaces and their test harness
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["json"] }
