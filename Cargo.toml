[workspace]
resolver = "2"
members = ["crates/*"]
# The vendored crossterm rides under [patch.crates-io] below; excluding
# it keeps cargo from claiming the tree when run from inside it.
exclude = ["vendor/crossterm"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/vhaudiquet/rhema"
authors = ["Valentin Haudiquet"]

[workspace.lints.rust]
missing_docs = "deny"

[workspace.dependencies]
# Serialization: session and message types must round-trip for checkpointing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Typed library errors
thiserror = "2"
# Async traits must stay object-safe (dyn ModelProvider, dyn ToolResolver)
async-trait = "0.1"
# Config file format (flat scalar fields; see crates/rhema-config)
serde_yaml = "0.9"
# Test runtime
tokio = { version = "1", features = ["macros", "rt"] }
# Hinnant's civil-date algorithms: the one home of days-since-epoch
# to (year, month, day), shared by the identity stamps, the memory
# stamps, the acp wire's RFC 3339, and the environment report
datealgo = "0.2"
# Property-based tests: generated inputs for the SSE decoder's chunk
# boundaries and the transcript's view invariants. Pinned exactly:
# Hegel is beta and changes its API between releases.
hegeltest = "=0.52.6"
# The system-prompt template (Jinja syntax); whitespace rules fit
# markdown templates. Builtins for the standard filters, `tojson`
# renders a tool's JSON schema into the prompt.
minijinja = { version = "3", default-features = false, features = ["serde", "debug", "builtins", "json"] }
# The Agent Client Protocol: schema types and the agent-side connection
# (see crates/rhema-acp). `unstable_end_turn_token_usage` lets the agent
# attach per-turn token totals to the `session/prompt` response; the
# field is additive on the wire, so clients without it ignore it.
agent-client-protocol = { version = "5.6", features = ["unstable_end_turn_token_usage"] }

# The tarball the installer serves is this profile's output. Release
# builds already carry no debug info, but the linker still writes the
# symbol and string tables: 9.8 MB of the 32 MB binary that nothing
# reads at runtime. Stripping leaves 22.6 MB, with no change to the
# generated code.
#
# `codegen-units = 1` compiles each crate as one LLVM module instead of
# sixteen, so the optimizer sees every function in the crate at once.
# That merges duplicate generic instantiations (mostly drop glue, serde
# impls and iterator adapters, measured 4 MB of them) and inlines across
# what used to be module boundaries: 22.6 MB -> 18.6 MB. Runtime is the
# same or slightly better; the cost is release build time, since each
# crate's codegen no longer splits across cores.
[profile.release]
strip = "symbols"
codegen-units = 1

# Vendored crossterm with the two key patches the TUI leans on (see
# vendor/README.md for provenance and refresh; delete this section to
# return to the crates.io release):
# - modifyOtherKeys parsing (CSI 27;…;…~), Ghostty's default shift+enter
#   sequence, which crossterm 0.29 drops;
# - kitty associated text (the `;text` tail of CSI u) decoded into the
#   key code, without it, every AltGr character and dead key is lost,
#   since an AltGr key's codepoint stays its base key (`@` arrives as
#   `à`) and the composed character rides only in the text field.
[patch.crates-io]
crossterm = { path = "vendor/crossterm" }
