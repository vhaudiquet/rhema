[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Valentin Haudiquet"]

[workspace.dependencies]
# Serialization: session and message types must round-trip for checkpointing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Typed library errors
thiserror = "2"
# Async traits must stay object-safe (dyn ModelProvider, dyn ToolResolver)
async-trait = "0.1"
# Config file format (flat scalar fields; see crates/rhema-config)
serde_yaml = "0.9"
# Test runtime
tokio = { version = "1", features = ["macros", "rt"] }
# The claw's HTTP surface: native routes plus SSE, and the OpenAI shim
axum = { version = "0.8", features = ["json"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# The system-prompt template (Jinja syntax); whitespace rules fit
# markdown templates
minijinja = { version = "3", default-features = false, features = ["serde", "debug"] }

# Local crossterm with modifyOtherKeys (CSI 27;…;…~) parsing — Ghostty's
# default shift+enter sequence, which crossterm 0.29 drops. Backed by the
# commit on the modify-other-keys branch of ~/Documents/contrib/crossterm;
# delete this section to return to the crates.io release.
[patch.crates-io]
crossterm = { path = "../../contrib/crossterm" }
